<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrap Detective Terminal</title>
    
    <!-- PyScript CSS & JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- JSON Config block safely loads packages and files -->
    <script type="config">
    {
      "packages": ["rich"],
      "files": {
        "./scrap_detective1.py": "./scrap_detective1.py"
      }
    }
    </script>

    <!-- Interactive Terminal -->
    <script type="py" terminal src="./scrap_detective1.py"></script>

</body>
</html>
